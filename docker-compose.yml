services:
  app:
    build: .
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://basecamp:basecamp@db:5432/basecamp
    env_file:
      - .env.local
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: basecamp
      POSTGRES_PASSWORD: basecamp
      POSTGRES_DB: basecamp
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U basecamp -d basecamp']
      interval: 5s
      timeout: 3s
      retries: 5

  db-init:
    build: .
    command: npx prisma db push --skip-generate
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://basecamp:basecamp@db:5432/basecamp
    profiles:
      - init

volumes:
  pgdata: